<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#050914" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DevDeck" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icon-256.png" />
<title>DevDeck Remote</title>
<style>
  :root {
    --bg: #050914;
    --surface: #0a1122;
    --surface-2: #151e32;
    --border: rgba(60, 130, 246, 0.16);
    --border-hi: rgba(60, 130, 246, 0.45);
    --text: #f8fafc;
    --muted: #94a3b8;
    --dim: #64748b;
    --accent: #3b82f6;
    --ok: #22c55e;
    --warn: #f59e0b;
    --bar: 56px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- screens ---------- */
  .screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    transition: transform .28s cubic-bezier(.32,.72,0,1);
    will-change: transform;
  }
  #preview-screen { transform: translateX(100%); z-index: 20; }
  body.previewing #preview-screen { transform: translateX(0); }

  /* ---------- top bar ---------- */
  .bar {
    flex: none;
    height: calc(var(--bar) + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 12px 0;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(5, 9, 20, .82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .bar h1 { font-size: 1rem; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .bar .sub {
    font-size: .72rem; color: var(--dim); font-weight: 400;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .grow { flex: 1; min-width: 0; }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.off { background: var(--warn); }

  .iconbtn {
    width: 40px; height: 40px; flex: none;
    display: grid; place-items: center;
    background: transparent; border: 0; border-radius: 10px;
    color: var(--muted); cursor: pointer;
  }
  .iconbtn:active { background: var(--surface-2); color: var(--text); }
  .iconbtn svg { width: 20px; height: 20px; }
  .spin { animation: spin .6s linear; }
  @keyframes spin { to { transform: rotate(360deg) } }

  /* ---------- list ---------- */
  main {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 12px 12px calc(20px + env(safe-area-inset-bottom));
  }

  .card {
    display: flex; align-items: center; gap: 12px;
    width: 100%; text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    color: inherit; font: inherit;
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:active { transform: scale(.985); border-color: var(--border-hi); }
  .card .body { min-width: 0; flex: 1; }
  .card .name {
    font-weight: 600; font-size: .95rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .meta {
    font-size: .76rem; color: var(--dim); margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pill {
    flex: none; font-size: .68rem; font-weight: 600;
    padding: 3px 8px; border-radius: 999px;
    background: rgba(34, 197, 94, .12); color: var(--ok);
    border: 1px solid rgba(34, 197, 94, .25);
  }
  .chev { flex: none; color: var(--dim); }

/* ---------- project rows ---------- */
  .proj {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; margin-bottom: 10px; overflow: hidden;
  }
  .proj-head {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 14px; background: none; border: 0; color: inherit;
    font: inherit; text-align: left; cursor: pointer;
  }
  .proj-head:active { background: var(--surface-2); }
  .proj-name { display: block; font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj-kind { display: block; font-size: .74rem; color: var(--dim); margin-top: 3px; }
  .caret { color: var(--dim); transition: transform .18s ease; flex: none; }
  .proj.open .caret { transform: rotate(90deg); }

  .proj-body { display: none; padding: 0 14px 12px; }
  .proj.open .proj-body { display: block; }

  .script {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0; border-top: 1px solid var(--border);
  }
  .script-name { flex: 1; min-width: 0; font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini {
    flex: none; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text);
    font: 600 .76rem/1 inherit; cursor: pointer;
  }
  .mini:active { opacity: .7; }
  .mini.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mini:disabled { opacity: .5; }
  .mini.icon { padding: 7px 9px; }
  .running-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none;
  }

  /* ---------- states ---------- */
  .empty { text-align: center; padding: 72px 24px; color: var(--muted); }
  .empty svg { width: 44px; height: 44px; color: var(--dim); margin-bottom: 14px; }
  .empty strong { display: block; font-size: .95rem; margin-bottom: 6px; }
  .empty p { margin: 0; font-size: .84rem; color: var(--dim); }

  .skel {
    height: 72px; border-radius: 14px; margin-bottom: 10px;
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 37%, var(--surface) 63%);
    background-size: 400% 100%;
    animation: sh 1.3s ease-in-out infinite;
  }
  @keyframes sh { 0% { background-position: 100% 50% } 100% { background-position: 0 50% } }

  #ptr {
    height: 0; overflow: hidden; display: grid; place-items: center;
    color: var(--dim); font-size: .74rem; transition: height .2s ease;
  }
  #ptr.on { height: 30px; }

/* ---------- login ---------- */
  #login-screen { z-index: 30; transform: translateX(0); display: none; }
  body.needs-login #login-screen { display: flex; }
  #login-screen .wrap {
    margin: auto; width: 100%; max-width: 340px; padding: 24px;
    display: flex; flex-direction: column; gap: 12px; text-align: center;
  }
  #login-screen h2 { margin: 0 0 4px; font-size: 1.15rem; letter-spacing: -.01em; }
  #login-screen p { margin: 0 0 14px; font-size: .84rem; color: var(--dim); }
  .field {
    width: 100%; padding: 13px 14px; font: inherit; font-size: .92rem;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 11px;
  }
  .field:focus { outline: none; border-color: var(--border-hi); }
  .primary {
    width: 100%; padding: 13px; margin-top: 4px;
    background: var(--accent); color: #fff; border: 0; border-radius: 11px;
    font: 600 .92rem/1 inherit; cursor: pointer;
  }
  .primary:disabled { opacity: .55; }
  .err { color: #f87171; font-size: .82rem; min-height: 1.1em; margin: 0; }

/* ---------- logs ---------- */
  #logs-screen { transform: translateX(100%); z-index: 25; }
  body.logging #logs-screen { transform: translateX(0); }
  #log-out {
    flex: 1; margin: 0; padding: 12px;
    overflow: auto; -webkit-overflow-scrolling: touch;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word;
    background: #03060e; color: #cbd5e1;
  }
  #log-out .e { color: #f87171; }
  #log-out .empty { color: var(--dim); font-style: italic; }
  .actions {
    flex: none; display: flex; gap: 8px; padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border); background: var(--bg);
  }
  .actions button {
    flex: 1; padding: 12px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    font: 600 .86rem/1 inherit; cursor: pointer;
  }
  .actions button:active { background: var(--surface-2); }
  .actions .danger { color: #f87171; border-color: rgba(248,113,113,.3); }
  .actions button:disabled { opacity: .5; }

  /* ---------- preview ---------- */
  #frame { flex: 1; width: 100%; border: 0; background: #fff; }
  #frame-fallback {
    flex: 1; display: none; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 30px; color: var(--muted);
  }
  body.frame-blocked #frame { display: none; }
  body.frame-blocked #frame-fallback { display: flex; }
  .btn {
    display: inline-block; margin-top: 16px; padding: 11px 20px;
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    font: 600 .88rem/1 inherit; text-decoration: none; cursor: pointer;
  }
</style>
</head>
<body>

<!-- ============ login ============ -->
<section class="screen" id="login-screen">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
    </div>
    <h2>DevDeck</h2>
    <p class="lead">Sign in to reach the projects on your PC.</p>

    <div id="cloud-form" style="display:none;">
      <input class="field" id="cl-email" type="email" autocomplete="username"
             autocapitalize="none" autocorrect="off" placeholder="Email" />
      <div class="pw">
        <input class="field" id="cl-pass" type="password" autocomplete="current-password" placeholder="Password" />
        <button id="cl-eye" type="button" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <p class="err" id="cl-err"></p>
      <button class="primary" id="cl-go">Sign in</button>
      <button class="link" id="use-local">Use this PC&rsquo;s password instead</button>
    </div>

    <div id="local-form">
      <input class="field" id="lg-user" type="text" autocomplete="username"
             autocapitalize="none" autocorrect="off" placeholder="Username" />
      <div class="pw">
        <input class="field" id="lg-pass" type="password" autocomplete="current-password" placeholder="Password" />
        <button id="lg-eye" type="button" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        </button>
      </div>
      <p class="err" id="lg-err"></p>
      <button class="primary" id="lg-go">Sign in</button>
    </div>
  </div>
</section>

<!-- ============ projects ============ -->
<section class="screen" id="list-screen">
  <div class="bar">
    <span class="dot" id="conn" aria-label="Connected"></span>
    <div class="grow">
      <h1>DevDeck</h1>
      <div class="sub" id="host"></div>
    </div>
    <button class="iconbtn" id="refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>
  <div id="ptr">Release to refresh</div>
  <main id="list">
    <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  </main>
</section>

<!-- ============ logs ============ -->
<section class="screen" id="logs-screen">
  <div class="bar">
    <button class="iconbtn" id="log-back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="grow">
      <h1 id="log-name">Logs</h1>
      <div class="sub" id="log-sub">waiting for output</div>
    </div>
    <button class="iconbtn" id="log-bottom" aria-label="Jump to latest">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
    </button>
  </div>
  <pre id="log-out"><span class="empty">Waiting for output...</span></pre>
  <div class="actions">
    <button id="log-restart">Restart</button>
    <button id="log-stop" class="danger">Stop</button>
  </div>
</section>

<!-- ============ preview ============ -->
<section class="screen" id="preview-screen">
  <div class="bar">
    <button class="iconbtn" id="back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="grow">
      <h1 id="p-name">Preview</h1>
      <div class="sub" id="p-url"></div>
    </div>
    <button class="iconbtn" id="reload" aria-label="Reload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
    <button class="iconbtn" id="external" aria-label="Open in browser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
    </button>
  </div>
  <iframe id="frame" title="Project preview"></iframe>
  <div id="frame-fallback">
    <strong>This project can't be embedded</strong>
    <p style="font-size:.84rem;color:var(--dim);margin:8px 0 0">
      It sends headers that block framing. Open it directly instead.
    </p>
    <a class="btn" id="fallback-link" target="_blank" rel="noopener">Open project</a>
  </div>
</section>

<script>
(function () {
  'use strict';

  var list    = document.getElementById('list');
  var conn    = document.getElementById('conn');
  var hostEl  = document.getElementById('host');
  var frame   = document.getElementById('frame');
  var current = null;
  var lastSig = '';

  hostEl.textContent = location.host;

  /* Derive a readable name from a "C:\\path\\to\\proj:script" process key. */
  function parseKey(key) {
    var i = key.lastIndexOf(':');
    var path = i > 2 ? key.slice(0, i) : key;
    var script = i > 2 ? key.slice(i + 1) : '';
    var parts = path.replace(/[\\/]+$/, '').split(/[\\/]/);
    return { name: parts[parts.length - 1] || path, script: script, path: path };
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var openPaths = {};

  function render(rows) {
    /* Skipping identical renders keeps scroll position and stops a tap's
       press state being wiped mid-gesture. */
    var sig = JSON.stringify(rows.map(function (r) {
      return [r.path, r.scripts.map(function (x) { return x.name + (x.running ? '1' : '0'); })];
    }));
    if (sig === lastSig) return;
    lastSig = sig;

    if (!rows.length) {
      list.innerHTML =
        '<div class="empty">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>' +
        '<strong>No projects yet</strong>' +
        '<p>Add a workspace on your PC and scan it. Your projects show up here.</p></div>';
      return;
    }

    list.innerHTML = rows.map(function (r) {
      var open = openPaths[r.path] ? ' open' : '';
      var scripts = r.scripts.map(function (sc) {
        var key = r.path + ':' + sc.name;
        if (sc.running) {
          return '<div class="script">' +
            '<span class="running-dot"></span>' +
            '<span class="script-name">' + esc(sc.name) + '</span>' +
            // Running without a port yet: still booting, or never serves
            // anything. Either way there is nothing to preview.
            (sc.url
              ? '<button class="mini go" data-act="open" data-url="' + esc(sc.url) + '" data-name="' + esc(r.name) + '">Preview</button>'
              : '') +
            '<button class="mini icon" data-act="logs" data-key="' + esc(key) + '" aria-label="Logs">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>' +
            '</button>' +
            '<button class="mini icon" data-act="stop" data-key="' + esc(key) + '" aria-label="Stop">' +
              '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>' +
            '</button>' +
          '</div>';
        }
        return '<div class="script">' +
          '<span class="script-name">' + esc(sc.name) + '</span>' +
          '<button class="mini go" data-act="start" data-key="' + esc(key) + '">Start</button>' +
        '</div>';
      }).join('');

      return '<div class="proj' + open + '" data-path="' + esc(r.path) + '">' +
        '<button class="proj-head" data-act="toggle">' +
          (r.running ? '<span class="running-dot"></span>' : '') +
          '<span style="flex:1;min-width:0;">' +
            '<span class="proj-name">' + esc(r.name) + '</span>' +
            '<span class="proj-kind">' + esc(r.kind || 'Project') + '</span>' +
          '</span>' +
          '<span class="caret"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>' +
        '</button>' +
        '<div class="proj-body">' + scripts + '</div>' +
      '</div>';
    }).join('');
  }

  function setConnected(ok) {
    conn.className = ok ? 'dot' : 'dot off';
    conn.setAttribute('aria-label', ok ? 'Connected' : 'Disconnected');
  }

  async function load() {
    try {
      var r = await fetch('/api/projects', { cache: 'no-store' });
      if (r.status === 401) { document.body.classList.add('needs-login'); return; }
      if (!r.ok) throw new Error(r.status);
      render(await r.json());
      setConnected(true);
    } catch (e) {
      setConnected(false);
      if (!list.querySelector('.card')) {
        lastSig = '';
        list.innerHTML =
          '<div class="empty"><strong>Can\'t reach DevDeck</strong>' +
          '<p>Check your PC is awake and on the same network.</p></div>';
      }
    }
  }

  /* ---------- navigation ---------- */
  function openPreview(url, name) {
    current = { url: url, name: name };
    document.getElementById('p-name').textContent = name;
    document.getElementById('p-url').textContent = url;
    document.getElementById('external').dataset.url = url;
    document.getElementById('fallback-link').href = url;
    document.body.classList.remove('frame-blocked');
    frame.src = url;
    document.body.classList.add('previewing');
    history.pushState({ preview: true }, '', '#' + encodeURIComponent(name));
  }

  function closePreview() {
    document.body.classList.remove('previewing');
    /* Blank the frame so the dev server stops streaming HMR in the background. */
    setTimeout(function () { if (!document.body.classList.contains('previewing')) frame.src = 'about:blank'; }, 300);
  }

  list.addEventListener('click', async function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var act = btn.dataset.act;

    if (act === 'toggle') {
      var card = btn.closest('.proj');
      var path = card.dataset.path;
      openPaths[path] = !openPaths[path];
      card.classList.toggle('open');
      return;
    }
    if (act === 'open')  { openPreview(btn.dataset.url, btn.dataset.name); return; }
    if (act === 'logs')  { openLogs(btn.dataset.key); return; }

    /* start and stop both take a moment; say so rather than looking stuck. */
    var original = btn.textContent;
    btn.disabled = true;
    if (act === 'start') btn.textContent = 'Starting\u2026';
    try {
      var r = await fetch('/api/process/' + act + '?key=' + encodeURIComponent(btn.dataset.key), { method: 'POST' });
      if (!r.ok) {
        var body = await r.json().catch(function () { return {}; });
        throw new Error(body.error || ('Could not ' + act));
      }
      /* A dev server needs a moment to bind before its preview exists. */
      lastSig = '';
      setTimeout(load, act === 'start' ? 1500 : 400);
    } catch (err) {
      alert(err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  });

  document.getElementById('back').addEventListener('click', function () { history.back(); });
  window.addEventListener('popstate', function () {
    closePreview();
    closeLogs();
  });

  document.getElementById('reload').addEventListener('click', function (e) {
    if (current) frame.src = current.url + (current.url.indexOf('?') < 0 ? '?' : '&') + '_r=' + Date.now();
    e.currentTarget.firstElementChild.classList.add('spin');
    setTimeout(function () { e.currentTarget.firstElementChild.classList.remove('spin'); }, 600);
  });

  document.getElementById('external').addEventListener('click', function (e) {
    var u = e.currentTarget.dataset.url;
    if (u) window.open(u, '_blank', 'noopener');
  });

  document.getElementById('refresh').addEventListener('click', function (e) {
    lastSig = '';
    load();
    e.currentTarget.firstElementChild.classList.add('spin');
    setTimeout(function () { e.currentTarget.firstElementChild.classList.remove('spin'); }, 600);
  });

  /* A framed page that refuses to load leaves the iframe blank; surface a way out. */
  frame.addEventListener('load', function () {
    try {
      if (frame.contentDocument && frame.contentDocument.body &&
          !frame.contentDocument.body.childNodes.length) {
        document.body.classList.add('frame-blocked');
      }
    } catch (err) { /* cross-origin means it loaded fine */ }
  });

/* ---------- logs ---------- */
  var logKey = null;
  var logSeq = null;
  var logStop = false;
  var logEl = document.getElementById('log-out');

  function atBottom() {
    return logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 60;
  }

  function appendLines(lines) {
    if (!lines.length) return;
    /* Only autoscroll when already at the bottom, so reading history is not
       yanked away every time a line arrives. */
    var stick = atBottom();

    var empty = logEl.querySelector('.empty');
    if (empty) empty.remove();

    var frag = document.createDocumentFragment();
    lines.forEach(function (l) {
      var span = document.createElement('span');
      if (l.stream === 'stderr') span.className = 'e';
      span.textContent = l.text + '\n';
      frag.appendChild(span);
      logSeq = l.seq;
    });
    logEl.appendChild(frag);

    /* Keep the DOM bounded; the backend already caps its own buffer. */
    while (logEl.childNodes.length > 600) logEl.removeChild(logEl.firstChild);

    if (stick) logEl.scrollTop = logEl.scrollHeight;
    document.getElementById('log-sub').textContent = 'live';
  }

  async function pumpLogs() {
    while (!logStop && logKey) {
      try {
        var q = '/api/logs/poll?key=' + encodeURIComponent(logKey) +
                (logSeq === null ? '' : '&after=' + logSeq);
        var r = await fetch(q, { cache: 'no-store' });
        if (r.status === 401) { document.body.classList.add('needs-login'); return; }
        appendLines(await r.json());
      } catch (e) {
        document.getElementById('log-sub').textContent = 'disconnected';
        await new Promise(function (r) { setTimeout(r, 2000); });
      }
    }
  }

  async function openLogs(key) {
    logKey = key;
    logSeq = null;
    logStop = false;
    logEl.innerHTML = '<span class="empty">Waiting for output...</span>';
    document.getElementById('log-name').textContent = parseKey(key).name;
    document.getElementById('log-sub').textContent = 'connecting';
    document.body.classList.add('logging');
    history.pushState({ logs: true }, '', '#logs');

    try {
      var r = await fetch('/api/logs?key=' + encodeURIComponent(key), { cache: 'no-store' });
      appendLines(await r.json());
    } catch (e) { /* the poll loop will report it */ }
    pumpLogs();
  }

  function closeLogs() {
    logStop = true;
    logKey = null;
    document.body.classList.remove('logging');
  }

  document.getElementById('log-back').addEventListener('click', function () { history.back(); });
  document.getElementById('log-bottom').addEventListener('click', function () {
    logEl.scrollTop = logEl.scrollHeight;
  });

  async function control(action, btn, label) {
    if (!logKey) return;
    var original = btn.textContent;
    btn.disabled = true;
    btn.textContent = label;
    try {
      var r = await fetch('/api/process/' + action + '?key=' + encodeURIComponent(logKey), { method: 'POST' });
      if (!r.ok) {
        var body = await r.json().catch(function () { return {}; });
        throw new Error(body.error || ('Could not ' + action));
      }
      if (action === 'restart') {
        logSeq = null;
        logEl.innerHTML = '<span class="empty">Restarting...</span>';
      }
    } catch (e) {
      document.getElementById('log-sub').textContent = e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  document.getElementById('log-restart').addEventListener('click', function () {
    control('restart', this, 'Restarting...');
  });
  document.getElementById('log-stop').addEventListener('click', function () {
    control('stop', this, 'Stopping...');
  });

  /* ---------- pull to refresh ---------- */
  var ptr = document.getElementById('ptr'), startY = 0, pulling = false;
  list.addEventListener('touchstart', function (e) {
    if (list.scrollTop === 0) { startY = e.touches[0].clientY; pulling = true; }
  }, { passive: true });
  list.addEventListener('touchmove', function (e) {
    if (pulling && e.touches[0].clientY - startY > 60) ptr.classList.add('on');
  }, { passive: true });
  list.addEventListener('touchend', function () {
    if (ptr.classList.contains('on')) { lastSig = ''; load(); }
    ptr.classList.remove('on');
    pulling = false;
  }, { passive: true });

/* ---------- session ---------- */
  async function checkSession() {
    try {
      var r = await fetch('/api/session', { cache: 'no-store' });
      var info = await r.json();
      /* With no account configured the gateway is LAN-convenience only, so
         there is nothing to sign in to. */
      var needs = (info.has_account || info.cloud) && !info.authenticated;
      document.body.classList.toggle('needs-login', needs);

      cloudCfg = info.cloud || null;
      /* Cloud sign-in works from any network; the local password is the
         fallback for when the cloud service is unreachable. */
      showCloudForm(!!cloudCfg);
      return !needs;
    } catch (e) {
      return false;
    }
  }

  document.getElementById('lg-go').addEventListener('click', async function () {
    var btn = this;
    var err = document.getElementById('lg-err');
    var user = document.getElementById('lg-user').value.trim();
    var pass = document.getElementById('lg-pass').value;
    if (!user || !pass) { err.textContent = 'Enter your username and password.'; return; }

    btn.disabled = true;
    btn.textContent = 'Signing in...';
    err.textContent = '';
    try {
      var r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pass })
      });
      if (!r.ok) {
        var body = await r.json().catch(function () { return {}; });
        throw new Error(body.error || 'Incorrect username or password');
      }
      document.getElementById('lg-pass').value = '';
      document.body.classList.remove('needs-login');
      lastSig = '';
      load();
    } catch (e) {
      err.textContent = e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });

  document.getElementById('lg-pass').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('lg-go').click();
  });

  /* Show-password toggle on both sign-in forms. */
  function wireEye(eyeId, fieldId) {
    var eye = document.getElementById(eyeId);
    var field = document.getElementById(fieldId);
    if (!eye || !field) return;
    eye.addEventListener('click', function () {
      var showing = field.type === 'text';
      field.type = showing ? 'password' : 'text';
      eye.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
    });
  }
  wireEye('cl-eye', 'cl-pass');
  wireEye('lg-eye', 'lg-pass');

  /* ---------- lifecycle ---------- */
  checkSession().then(load);
  var timer = setInterval(load, 3000);
  document.addEventListener('visibilitychange', function () {
    /* Polling a sleeping phone just burns battery. */
    clearInterval(timer);
    if (!document.hidden) { load(); timer = setInterval(load, 3000); }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
