[package]
name = "e-tauri-project-manager"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "e_tauri_project_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6.0.0"
rfd = "0.17.2"
tauri-plugin-single-instance = "2.4.3"
regex = "1"

# --- mobile gateway ---------------------------------------------------------
# Only ever proxies to 127.0.0.1, so the proxy's default TLS stack (and the
# hyper-rustls compile it drags in) is switched off.
axum = "0.8"
axum-reverse-proxy = { version = "2.2", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"] }
local-ip-address = "0.6"
qrcode = "0.14"

# Local accounts: argon2id password hashing, OS CSPRNG for session tokens.
# No database - a single-user desktop app stores one account in a JSON file.
argon2 = { version = "0.6", features = ["getrandom"] }
getrandom = "0.4"

# SQLite, compiled into the binary. "bundled" means no server, no system
# SQLite, and nothing for users to install.
rusqlite = { version = "0.40", features = ["bundled"] }

