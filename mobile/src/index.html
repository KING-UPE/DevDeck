<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#050914" />
<title>DevDeck Remote</title>
<style>
  :root {
    --bg: #050914;
    --surface: #0a1122;
    --surface-2: #151e32;
    --border: rgba(60, 130, 246, 0.16);
    --border-hi: rgba(60, 130, 246, 0.45);
    --text: #f8fafc;
    --muted: #94a3b8;
    --dim: #64748b;
    --accent: #3b82f6;
    --ok: #22c55e;
    --warn: #f59e0b;
    --bad: #f87171;
    --bar: 58px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0;
    background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, system-ui, sans-serif;
    overscroll-behavior: none; -webkit-font-smoothing: antialiased;
  }

  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    background: var(--bg);
    transition: transform .28s cubic-bezier(.32,.72,0,1);
    will-change: transform;
  }
  #devices-screen, #projects-screen, #logs-screen, #preview-screen { transform: translateX(100%); }
  body[data-at="devices"]  #devices-screen,
  body[data-at="projects"] #devices-screen,
  body[data-at="logs"]     #devices-screen,
  body[data-at="preview"]  #devices-screen { transform: translateX(0); }
  body[data-at="projects"] #projects-screen,
  body[data-at="logs"]     #projects-screen,
  body[data-at="preview"]  #projects-screen { transform: translateX(0); }
  body[data-at="logs"]     #logs-screen { transform: translateX(0); z-index: 25; }
  body[data-at="preview"]  #preview-screen { transform: translateX(0); z-index: 26; }
  #devices-screen { z-index: 10; } #projects-screen { z-index: 20; }

  /* ---------- bars ---------- */
  .bar {
    flex: none; height: calc(var(--bar) + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 12px 0;
    display: flex; align-items: center; gap: 10px;
    background: rgba(5,9,20,.85); backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }
  .bar h1 { font-size: 1rem; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .bar .sub { font-size: .72rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grow { flex: 1; min-width: 0; }
  .iconbtn {
    width: 40px; height: 40px; flex: none; display: grid; place-items: center;
    background: transparent; border: 0; border-radius: 10px; color: var(--muted); cursor: pointer;
  }
  .iconbtn:active { background: var(--surface-2); color: var(--text); }
  .iconbtn svg { width: 20px; height: 20px; }
  .spin { animation: spin .6s linear; }
  @keyframes spin { to { transform: rotate(360deg) } }

  main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
         padding: 12px 12px calc(20px + env(safe-area-inset-bottom)); }

  /* ---------- sign in ---------- */
  #auth-screen { z-index: 40; transform: translateX(0); }
  body[data-at="auth"] #auth-screen { display: flex; }
  body:not([data-at="auth"]) #auth-screen { display: none; }
  #auth-screen .wrap {
    margin: auto; width: 100%; max-width: 340px; padding: 24px;
    display: flex; flex-direction: column; text-align: center;
  }
  .mark {
    width: 58px; height: 58px; margin: 0 auto 18px; border-radius: 16px;
    background: linear-gradient(140deg, var(--accent), #1d4ed8);
    display: grid; place-items: center; color: #fff;
  }
  .mark svg { width: 28px; height: 28px; }
  #auth-screen h2 { margin: 0 0 4px; font-size: 1.35rem; letter-spacing: -.02em; }
  #auth-screen .lead { margin: 0 0 24px; font-size: .86rem; color: var(--dim); }
  .field {
    width: 100%; padding: 14px; margin-bottom: 10px; font: inherit; font-size: .92rem;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
  }
  .field:focus { outline: none; border-color: var(--border-hi); background: var(--surface-2); }
  .pw { position: relative; }
  .pw .field { padding-right: 46px; }
  .pw button {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: 0; color: var(--dim); padding: 8px; cursor: pointer; line-height: 0;
  }
  .pw button svg { width: 18px; height: 18px; }
  .primary {
    width: 100%; padding: 14px; margin-top: 6px;
    background: var(--accent); color: #fff; border: 0; border-radius: 12px;
    font: 600 .95rem/1 inherit; cursor: pointer;
  }
  .primary:disabled { opacity: .55; }
  .ghost {
    width: 100%; padding: 13px; margin-top: 10px;
    background: transparent; color: var(--text); border: 1px solid var(--border);
    border-radius: 12px; font: 600 .9rem/1 inherit; cursor: pointer;
  }
  .linkbtn {
    margin-top: 16px; background: none; border: 0; color: var(--dim);
    font: inherit; font-size: .8rem; cursor: pointer;
  }
  .tabs { display: flex; gap: 4px; background: var(--surface); padding: 4px;
          border-radius: 11px; margin-bottom: 16px; }
  .tabs button {
    flex: 1; padding: 9px; font: 600 .84rem/1 inherit; border: 0; border-radius: 8px;
    background: transparent; color: var(--dim); cursor: pointer;
  }
  .tabs button.on { background: var(--accent); color: #fff; }
  .msg { font-size: .82rem; min-height: 1.2em; margin: 8px 0 0; text-align: left; }
  .msg.bad { color: var(--bad); } .msg.good { color: var(--ok); }

  /* ---------- cards ---------- */
  .card {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 15px; margin-bottom: 10px;
    color: inherit; font: inherit; cursor: pointer;
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:active { transform: scale(.985); border-color: var(--border-hi); }
  /* Both are spans, so without this they run together on one line and the
     margin below does nothing. */
  .card .name { display: block; font-weight: 600; font-size: .95rem; }
  .card .meta { display: block; font-size: .76rem; color: var(--dim); margin-top: 3px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.on { background: var(--ok); } .dot.off { background: var(--dim); }
  .chev { flex: none; color: var(--dim); }

  .proj { background: var(--surface); border: 1px solid var(--border);
          border-radius: 14px; margin-bottom: 10px; overflow: hidden; }
  .proj-head {
    display: flex; align-items: center; gap: 12px; width: 100%;
    padding: 14px; background: none; border: 0; color: inherit; font: inherit;
    text-align: left; cursor: pointer;
  }
  .proj-head:active { background: var(--surface-2); }
  .proj-name { display: block; font-weight: 600; font-size: .95rem;
               white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj-kind { display: block; font-size: .74rem; color: var(--dim); margin-top: 3px; }
  .caret { color: var(--dim); transition: transform .18s ease; flex: none; }
  .proj.open .caret { transform: rotate(90deg); }
  .proj-body { display: none; padding: 0 14px 12px; }
  .proj.open .proj-body { display: block; }
  .script { display: flex; align-items: center; gap: 10px; padding: 9px 0;
            border-top: 1px solid var(--border); }
  .script-name { flex: 1; min-width: 0; font-size: .85rem;
                 white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini {
    flex: none; padding: 7px 12px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font: 600 .76rem/1 inherit; cursor: pointer;
  }
  .mini:active { opacity: .7; }
  .mini.go { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mini:disabled { opacity: .5; }
  .mini.icon { padding: 7px 9px; }

  .empty { text-align: center; padding: 64px 24px; color: var(--muted); }
  .empty svg { width: 42px; height: 42px; color: var(--dim); margin-bottom: 14px; }
  .empty strong { display: block; font-size: .95rem; margin-bottom: 6px; }
  .empty p { margin: 0; font-size: .84rem; color: var(--dim); }
  .skel {
    height: 70px; border-radius: 14px; margin-bottom: 10px;
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 37%, var(--surface) 63%);
    background-size: 400% 100%; animation: sh 1.3s ease-in-out infinite;
  }
  @keyframes sh { 0% { background-position: 100% 50% } 100% { background-position: 0 50% } }

  /* ---------- logs / preview ---------- */
  #log-out {
    flex: 1; margin: 0; padding: 12px; overflow: auto;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; background: #03060e; color: #cbd5e1;
  }
  #log-out .e { color: var(--bad); }
  #log-out .empty { color: var(--dim); font-style: italic; }
  .actions {
    flex: none; display: flex; gap: 8px; padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border); background: var(--bg);
  }
  .actions button {
    flex: 1; padding: 12px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font: 600 .86rem/1 inherit; cursor: pointer;
  }
  .actions .danger { color: var(--bad); border-color: rgba(248,113,113,.3); }
  #frame { flex: 1; width: 100%; border: 0; background: #fff; }

  /* one line of input plus a send button, on the same row */
  .sendrow {
    flex: none; display: flex; gap: 8px; align-items: center;
    padding: 10px 12px 0; background: var(--bg);
  }
  .sendrow .field { margin: 0; flex: 1; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .82rem; }
  .sendrow .send { flex: none; }
  .sendrow[hidden] { display: none; }

  /* workspace grouping */
  .ws-head {
    display: flex; align-items: center; gap: 8px;
    padding: 16px 4px 6px; color: var(--dim);
    font: 600 .72rem/1 inherit; letter-spacing: .08em; text-transform: uppercase;
  }
  .ws-head .count {
    margin-left: auto; text-transform: none; letter-spacing: 0;
    font-weight: 500; font-size: .74rem;
  }
  .ws-head svg { width: 13px; height: 13px; flex: none; }

  /* run a one-off command */
  .cmdrow { display: flex; gap: 8px; padding: 8px 10px 10px; }
  .cmdrow .field {
    margin: 0; flex: 1; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .78rem; padding: 9px 11px;
  }
  .cmdrow button {
    flex: none; padding: 0 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); font: 600 .78rem/1 inherit; cursor: pointer;
  }
</style>
</head>
<body data-at="auth">

<!-- ============ sign in ============ -->
<section class="screen" id="auth-screen">
  <div class="wrap">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
    </div>
    <h2>DevDeck Remote</h2>
    <p class="lead">Sign in with the same account as your computer.</p>

    <div class="tabs">
      <button id="tab-in" class="on">Sign in</button>
      <button id="tab-up">Create account</button>
    </div>

    <input class="field" id="email" type="email" autocomplete="username"
           autocapitalize="none" autocorrect="off" placeholder="Email" />
    <div class="pw">
      <input class="field" id="pass" type="password" autocomplete="current-password" placeholder="Password" />
      <button id="eye" type="button" aria-label="Show password">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
    <input class="field" id="pass2" type="password" autocomplete="new-password"
           placeholder="Re-enter password" style="display:none;" />

    <p class="msg" id="auth-msg"></p>
    <button class="primary" id="go">Sign in</button>
    <button class="ghost" id="link-device">Link with a code instead</button>
    <button class="linkbtn" id="forgot">Forgot password?</button>
  </div>
</section>

<!-- ============ devices ============ -->
<section class="screen" id="devices-screen">
  <div class="bar">
    <div class="grow">
      <h1>Your computers</h1>
      <div class="sub" id="who"></div>
    </div>
    <button class="iconbtn" id="dev-refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
    <button class="iconbtn" id="sign-out" aria-label="Sign out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
  <main id="devices"><div class="skel"></div><div class="skel"></div></main>
</section>

<!-- ============ projects ============ -->
<section class="screen" id="projects-screen">
  <div class="bar">
    <button class="iconbtn" id="proj-back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="grow">
      <h1 id="dev-name">Projects</h1>
      <div class="sub" id="dev-sub"></div>
    </div>
    <button class="iconbtn" id="proj-refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>
  <main id="projects"><div class="skel"></div><div class="skel"></div></main>
</section>

<!-- ============ logs ============ -->
<section class="screen" id="logs-screen">
  <div class="bar">
    <button class="iconbtn" id="log-back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="grow"><h1 id="log-name">Logs</h1><div class="sub" id="log-sub"></div></div>
    <button class="iconbtn" id="log-bottom" aria-label="Latest">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
    </button>
  </div>
  <pre id="log-out"><span class="empty">Waiting for output...</span></pre>
  <!-- Dev tooling asks questions, and a phone that cannot answer them leaves
       the process stuck with nothing to do but kill it. -->
  <form class="sendrow" id="stdin-form" autocomplete="off">
    <input class="field" id="stdin-text" placeholder="Type a reply and send" />
    <button class="iconbtn send" id="stdin-send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </form>
  <div class="actions">
    <button id="log-restart">Restart</button>
    <button id="log-stop" class="danger">Stop</button>
  </div>
</section>

<!-- ============ preview ============ -->
<section class="screen" id="preview-screen">
  <div class="bar">
    <button class="iconbtn" id="prev-back" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="grow"><h1 id="prev-name">Preview</h1><div class="sub" id="prev-url"></div></div>
    <button class="iconbtn" id="prev-share" aria-label="Copy link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    </button>
    <button class="iconbtn" id="prev-reload" aria-label="Reload">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
    </button>
  </div>
  <iframe id="frame" title="Project preview"></iframe>
</section>

<script src="app.js"></script>
</body>
</html>
