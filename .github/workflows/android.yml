name: "Build DevDeck Remote (Android)"

# Runs on the same tags as the desktop release and attaches the APK to it.
#
# Building here rather than on a developer's machine is deliberate: Tauri links
# the compiled Rust library into the Android project with a symlink, and Windows
# refuses those to a non-administrator. A Linux runner has no such restriction,
# so the APK builds without anyone enabling Developer Mode.

on:
  push:
    tags:
      - 'v*'
  # Handy for testing the workflow without cutting a release.
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Gradle needs a JDK; 17 is what the Android Gradle Plugin expects.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # `packages: ''` is required. The action's default is to install `tools`,
      # which Google has removed from the SDK repository, so the default makes
      # sdkmanager exit non-zero and the job dies before it builds anything.
      # The packages this build actually needs are installed in the next step.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            mobile/src-tauri/target
          key: android-cargo-${{ hashFiles('mobile/src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        working-directory: mobile
        run: npm install

      - name: Generate the Android project
        working-directory: mobile
        run: npx tauri android init

      # Only the two ARM targets are built. `i686` and `x86_64` exist for
      # emulators, and including all four put ~110 MB of native library each
      # into a single APK.
      #
      # A keystore turns this into a properly signed release build. Without one
      # the job still produces an installable debug-signed APK, so a fork can
      # build without holding any secrets.
      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "have_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret; building a debug-signed APK."
            echo "have_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.have_keystore == 'true'
        working-directory: mobile
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cat >> src-tauri/gen/android/keystore.properties <<EOF
          password=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          EOF
          npx tauri android build --apk --target aarch64 armv7

      - name: Build debug APK
        if: steps.keystore.outputs.have_keystore == 'false'
        working-directory: mobile
        run: npx tauri android build --apk --debug --target aarch64 armv7

      - name: Collect the APK
        id: collect
        run: |
          APK=$(find mobile/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "No APK was produced." >&2
            exit 1
          fi
          # A predictable name, so the download page can recognise it.
          DEST="DevDeck-Remote-${GITHUB_REF_NAME:-dev}.apk"
          cp "$APK" "$DEST"
          echo "apk=$DEST" >> $GITHUB_OUTPUT
          ls -lh "$DEST"

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: devdeck-remote-apk
          path: ${{ steps.collect.outputs.apk }}

      # Only attach to a release when this run came from a tag.
      #
      # The desktop workflow is what creates the release, and it runs in
      # parallel with this one. Whichever finishes first must not fail, so wait
      # for the release to exist rather than assuming it already does.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "${{ steps.collect.outputs.apk }}" --clobber
              exit 0
            fi
            echo "Release $GITHUB_REF_NAME does not exist yet; waiting ($i/60)."
            sleep 30
          done
          echo "The release never appeared, so the APK could not be attached." >&2
          echo "It is still downloadable from this run's build artifacts." >&2
          exit 1
