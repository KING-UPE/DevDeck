name: "Publish Tauri Apps"

on:
  push:
    tags:
      - 'v*'
  # So the installers can be rebuilt without moving a tag.
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm install

      # An empty tagName means "build, touch no release". Publishing is the
      # separate job below, because this action's create-release call is
      # refused by this repository's Actions token even when the job is granted
      # `contents: write` - which threw away three finished builds at v1.1.0.
      # Nothing here needs release permission, so a red job now means a genuinely
      # broken build.
      - name: build tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ''

      - name: Upload the installers as build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

  # Collect what the three platforms built and publish it in one place.
  #
  # Doing this with the `gh` CLI rather than inside the build also answers a
  # question left open at v1.1.0: whether the refusal was the token's or the
  # action's. If this succeeds, it was the action.
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect every platform's installers
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mapfile -t FILES < <(find dist -type f)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "No installers were produced." >&2
            exit 1
          fi
          printf '%s\n' "${FILES[@]}"

          # The Android workflow runs in parallel and waits for this release to
          # exist, so create it rather than assuming either order.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "DevDeck $GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
